<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>reMarkable Toolkit</title>
<link rel="stylesheet" href="/assets/index.css" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="shared/servers.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="rmx-popup-header">
    <p class="responsive-heading-sm" style="margin:0">reMarkable Toolkit</p>
    <button id="openManager" type="button" class="ark-button ark-button--tertiary-neutral ark-button-small" data-i18n-title="openManager" title="Dateiverwaltung öffnen" aria-label="Dateiverwaltung öffnen">🗃</button>
  </header>

  <section id="serverPanel" class="rmx-popup-section"></section>

  <details class="rmx-popup-section rmx-popup-group rmx-xpander rmx-xpander--page" id="grpPage" open>
    <summary class="rmx-xhead">
      <span class="rmx-badgeslot"><span class="rmx-count rmx-headbadge" id="pageBadge">1</span></span>
      <span class="responsive-body-md rmx-xtitle" data-i18n="pageAsPdfHead">Seite als PDF</span>
      <svg class="rmx-caret" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
    </summary>
    <div class="rmx-xbody">
      <p id="articleStatus" class="responsive-body-sm rmx-muted" data-i18n="loading">Lade …</p>
      <div class="rmx-field-row">
        <label for="fontSlider" class="responsive-body-sm rmx-muted" data-i18n="fontSize">Schriftgröße</label>
        <input id="fontSlider" type="range" min="10" max="28" value="16" step="1" />
        <span id="fontSizeValue" class="rmx-value-badge">16</span>
      </div>
    </div>
  </details>

  <details class="rmx-popup-section rmx-popup-group rmx-xpander" id="grpImages">
    <summary class="rmx-xhead">
      <span class="rmx-badgeslot"><span class="rmx-count rmx-headbadge" id="imgBadge"></span></span>
      <span class="responsive-body-md rmx-xtitle" data-i18n="imagesHead">Bilder</span>
      <svg class="rmx-caret" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
    </summary>
    <div class="rmx-xbody">
      <p id="imageStatus" class="responsive-body-sm rmx-muted">—</p>
      <div id="imageStrip" class="image-strip"></div>
      <div class="rmx-select-row">
        <button id="selectAllBtn" type="button" class="ark-link responsive-body-sm" data-i18n="selectAll">Alles auswählen</button>
        <button id="selectNoneBtn" type="button" class="ark-link responsive-body-sm" data-i18n="clearSelection">Auswahl aufheben</button>
      </div>
      <div class="rmx-switchrow">
        <span class="ark-switch">
          <input type="checkbox" role="switch" class="ark-switch--input" id="onePerPdf">
          <span class="ark-switch--track"><span class="ark-switch--thumb"></span></span>
        </span>
        <label for="onePerPdf" class="txt" style="cursor:pointer">
          <span class="responsive-body-md" data-i18n="oneImagePerPdf">Einzelmodus</span>
          <small class="responsive-body-sm rmx-muted" data-i18n="oneImagePerPdfHint">Jedes Bild als eigenes PDF</small>
        </label>
      </div>
    </div>
  </details>

  <details class="rmx-popup-section rmx-xpander rmx-popup-status" id="statusBox" hidden>
    <summary class="rmx-xhead">
      <span class="responsive-body-sm rmx-xtitle rmx-muted" id="statusSummaryText"></span>
      <span class="rmx-flex"></span>
      <span class="rmx-spinner rmx-status-spin" id="statusSpin" aria-hidden="true"></span>
      <svg class="rmx-caret" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
    </summary>
    <ul id="results" class="results-list"></ul>
  </details>

  <section class="rmx-popup-section rmx-popup-section--send">
    <button id="sendBtn" type="button" class="ark-button ark-button--primary ark-button-large" disabled style="width:100%">Senden</button>
  </section>

  <script src="shared/filename.js"></script>
  <script src="shared/servers.js"></script>
  <script src="libs/pdfkit.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
