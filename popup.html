<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>reMarkable Toolkit</title>
<link rel="stylesheet" href="/assets/index.css" />
<link rel="stylesheet" href="/assets/app.css" />
<link rel="stylesheet" href="shared/servers.css" />
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="rmx-popup-header">
    <p class="responsive-heading-sm" style="margin:0">reMarkable Toolkit</p>
    <span class="rmx-popup-tools">
      <button id="openManager" type="button" class="ark-button ark-button--tertiary-neutral ark-button-small" data-i18n-title="openManager" title="Dateiverwaltung öffnen" aria-label="Dateiverwaltung öffnen">🗃</button>
      <div class="ark-select rmx-lang rmx-popup-lang">
        <select id="lang-select" aria-label="Language" title="Language"></select>
        <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
      </div>
    </span>
  </header>

  <section id="serverPanel" class="rmx-popup-section"></section>

  <details class="rmx-popup-section rmx-popup-group rmx-xpander rmx-xpander--page" id="grpPage" open>
    <summary class="rmx-xhead">
      <span class="rmx-badgeslot"><span class="rmx-count rmx-headbadge" id="pageBadge">1</span></span>
      <span class="responsive-body-md rmx-xtitle" data-i18n="pageAsPdfHead">Seite als PDF</span>
      <span class="rmx-xswitch" aria-hidden="true"><span class="rmx-xswitch-thumb"></span></span>
    </summary>
    <div class="rmx-xbody">
      <p id="articleStatus" class="responsive-body-sm rmx-muted" data-i18n="loading">Lade …</p>
      <div class="rmx-field-row">
        <label for="fontSlider" class="responsive-body-sm rmx-muted" data-i18n="fontSize">Schriftgröße</label>
        <input id="fontSlider" type="range" min="10" max="28" value="16" step="1" />
        <span id="fontSizeValue" class="rmx-value-badge">16</span>
      </div>
    </div>
  </details>

  <details class="rmx-popup-section rmx-popup-group rmx-xpander" id="grpImages">
    <summary class="rmx-xhead">
      <span class="rmx-badgeslot"><span class="rmx-count rmx-headbadge" id="imgBadge"></span></span>
      <span class="responsive-body-md rmx-xtitle" data-i18n="imagesHead">Bilder</span>
      <span class="rmx-xswitch" aria-hidden="true"><span class="rmx-xswitch-thumb"></span></span>
    </summary>
    <div class="rmx-xbody">
      <p id="imageStatus" class="responsive-body-sm rmx-muted">—</p>
      <div id="imageStrip" class="image-strip"></div>
      <div id="minEdgeRow" class="rmx-field-row rmx-minedge-row" hidden>
        <label class="responsive-body-sm rmx-muted" data-i18n="minEdge">Breite</label>
        <span id="minEdgeMin" class="rmx-value-badge">0 px</span>
        <div class="rmx-range2" id="edgeRange">
          <input id="minEdgeSlider" type="range" min="0" max="0" value="0" step="1" aria-label="Minimum" />
          <input id="maxEdgeSlider" type="range" min="0" max="0" value="0" step="1" aria-label="Maximum" />
        </div>
        <span id="minEdgeMaxVal" class="rmx-value-badge">0 px</span>
      </div>
      <div class="rmx-select-row rmx-selbar">
        <button id="selectAllBtn" type="button" class="ark-button ark-button--secondary ark-button-small" data-i18n-title="selectAll">
          <svg aria-hidden="true" width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48ZM72,168a8,8,0,0,1-5.66-2.34l-24-24a8,8,0,0,1,11.32-11.32L72,148.69l58.34-58.35a8,8,0,0,1,11.32,11.32l-64,64A8,8,0,0,1,72,168Zm141.66-66.34-64,64a8,8,0,0,1-11.32,0l-16-16a8,8,0,0,1,11.32-11.32L144,148.69l58.34-58.35a8,8,0,0,1,11.32,11.32Z"/></svg>
          <p class="responsive-body-sm" data-i18n="selectAll">Alles auswählen</p>
        </button>
        <button id="selectNoneBtn" type="button" class="ark-button ark-button--secondary ark-button-small" data-i18n-title="clearSelection">
          <svg class="rmx-ico--ghost" aria-hidden="true" width="16" height="16" viewBox="0 0 256 256" fill="currentColor"><path d="M224,48H32A16,16,0,0,0,16,64V192a16,16,0,0,0,16,16H224a16,16,0,0,0,16-16V64A16,16,0,0,0,224,48ZM72,168a8,8,0,0,1-5.66-2.34l-24-24a8,8,0,0,1,11.32-11.32L72,148.69l58.34-58.35a8,8,0,0,1,11.32,11.32l-64,64A8,8,0,0,1,72,168Zm141.66-66.34-64,64a8,8,0,0,1-11.32,0l-16-16a8,8,0,0,1,11.32-11.32L144,148.69l58.34-58.35a8,8,0,0,1,11.32,11.32Z"/></svg>
          <p class="responsive-body-sm" data-i18n="clearSelection">Auswahl aufheben</p>
        </button>
      </div>
      <div class="rmx-switchrow">
        <span class="ark-switch">
          <input type="checkbox" role="switch" class="ark-switch--input" id="onePerPdf">
          <span class="ark-switch--track"><span class="ark-switch--thumb"></span></span>
        </span>
        <label for="onePerPdf" class="txt" style="cursor:pointer">
          <span class="responsive-body-md" data-i18n="oneImagePerPdf">Einzelmodus</span>
          <small class="responsive-body-sm rmx-muted" data-i18n="oneImagePerPdfHint">Jedes Bild als eigenes PDF</small>
        </label>
      </div>
    </div>
  </details>

  <details class="rmx-popup-section rmx-xpander rmx-popup-status" id="statusBox" hidden>
    <summary class="rmx-xhead">
      <span class="responsive-body-sm rmx-xtitle rmx-muted" id="statusSummaryText"></span>
      <span class="rmx-flex"></span>
      <span class="rmx-spinner rmx-status-spin" id="statusSpin" aria-hidden="true"></span>
      <svg class="rmx-caret" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 256 256" aria-hidden="true"><path d="M213.66,101.66l-80,80a8,8,0,0,1-11.32,0l-80-80A8,8,0,0,1,53.66,90.34L128,164.69l74.34-74.35a8,8,0,0,1,11.32,11.32Z"/></svg>
    </summary>
    <ul id="results" class="results-list"></ul>
  </details>

  <section id="sendPanel" class="rmx-popup-section rmx-popup-section--send">
    <button id="sendBtn" type="button" class="ark-button ark-button--primary ark-button-large" disabled style="width:100%">Senden</button>
  </section>

  <script src="shared/filename.js"></script>
  <script src="shared/servers.js"></script>
  <script src="libs/pdfkit.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
