name: ort-vendor-update
on:
  push:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: onnxruntime-web 1.27.0 aus jsDelivr laden
        run: |
          base=https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist
          curl -fsSL -o assets/vendor/onnxruntime-web/ort.min.js "$base/ort.min.js"
          curl -fsSL -o assets/vendor/onnxruntime-web/ort-wasm-simd-threaded.mjs "$base/ort-wasm-simd-threaded.mjs"
          curl -fsSL -o assets/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm "$base/ort-wasm-simd-threaded.wasm"
          ls -l assets/vendor/onnxruntime-web/
          sha256sum assets/vendor/onnxruntime-web/*
      - name: Committen
        run: |
          git config user.name "vibe-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/onnxruntime-web/
          git commit -m "Vendor: onnxruntime-web 1.19.2 -> 1.27.0 (ConvInteger im WASM-EP)" || echo "identisch - nichts zu committen"
          git push
