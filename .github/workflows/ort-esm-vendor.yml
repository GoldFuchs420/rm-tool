name: ort-esm-vendor
on:
  push:
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ort.wasm.min.mjs (ESM, wasm-only) aus jsDelivr 1.27.0 laden
        run: |
          curl -fsSL -o assets/vendor/onnxruntime-web/ort.wasm.min.mjs https://cdn.jsdelivr.net/npm/onnxruntime-web@1.27.0/dist/ort.wasm.min.mjs
          ls -l assets/vendor/onnxruntime-web/
      - name: Committen
        run: |
          git config user.name "vibe-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/vendor/onnxruntime-web/ort.wasm.min.mjs
          git commit -m "Vendor: ort.wasm.min.mjs (ESM, wasm-only) ergänzt" || echo "nichts zu committen"
          git push
