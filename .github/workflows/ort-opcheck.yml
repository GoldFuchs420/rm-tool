name: ort-opcheck
on:
  push:
permissions:
  contents: write
jobs:
  opcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kernel-Suche in JS-Bundle und WASM
        run: |
          {
          echo "== vendored (main, 1.27.0) ==";
          ls -l assets/vendor/onnxruntime-web/;
          echo "-- ort.min.js enthaelt ConvInteger:"; grep -c ConvInteger assets/vendor/onnxruntime-web/ort.min.js || true;
          echo "-- wasm enthaelt ConvInteger:"; grep -ac ConvInteger assets/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm || true;
          echo "-- wasm enthaelt MatMulInteger:"; grep -ac MatMulInteger assets/vendor/onnxruntime-web/ort-wasm-simd-threaded.wasm || true;
          echo "== 1.19.2 (jsDelivr) ==";
          curl -fsSL -o /tmp/o119.js https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.min.js;
          curl -fsSL -o /tmp/o119.wasm https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort-wasm-simd-threaded.wasm;
          echo "-- ort.min.js enthaelt ConvInteger:"; grep -c ConvInteger /tmp/o119.js || true;
          echo "-- wasm enthaelt ConvInteger:"; grep -ac ConvInteger /tmp/o119.wasm || true;
          } > ort-opcheck.txt 2>&1
      - name: Committen
        run: |
          git config user.name "vibe-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ort-opcheck.txt
          git commit -m "CI: ORT-Op-Check" || echo "nichts zu committen"
          git push
