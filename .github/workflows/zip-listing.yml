name: zip-listing
on:
  push:
permissions:
  contents: write
jobs:
  listing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP-Inhalt auflisten
        run: |
          { echo "== zipinfo -1 =="; zipinfo -1 tests/Test.rmdoc; echo "== unzip -l (Kopf) =="; unzip -l tests/Test.rmdoc | head -40; } > tests/zip-listing.txt
      - name: Ergebnis committen
        run: |
          git config user.name "vibe-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/zip-listing.txt
          git commit -m "CI: ZIP-Inhalt von tests/Test.rmdoc auflisten" || echo "nichts zu committen"
          git push
