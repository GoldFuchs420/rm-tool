name: dehtr-fp32-vendor
on:
  push:
permissions:
  contents: write
jobs:
  fp32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: model-fp32.onnx von Hugging Face laden (SHA-256 geprüft)
        run: |
          curl -fsSL -o assets/models/de-htr-v2/model-fp32.onnx https://huggingface.co/naeyn/de-htr-web-v2/resolve/main/model-fp32.onnx
          echo "68b46411b8236b44d0d98865909d217ef13b41f12db769993c67eeb8d6e8c45a  assets/models/de-htr-v2/model-fp32.onnx" | sha256sum -c -
          ls -l assets/models/de-htr-v2/
      - name: Committen
        run: |
          git config user.name "vibe-ci"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/models/de-htr-v2/model-fp32.onnx
          git commit -m "Modell: de-htr-v2 model-fp32.onnx (int8 laeuft nicht im ORT-WASM-EP)" || echo "nichts zu committen"
          git push
